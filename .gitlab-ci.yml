stages:
  - validate
  - test
  - publish

default:
  image: php:8.0-alpine
  cache:
    key: "php-${CI_JOB_IMAGE}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .composer/cache
    policy: pull-push
  before_script:
    - apk add --no-cache git unzip libzip-dev curl
    - docker-php-ext-install zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --2

validate:
  stage: validate
  script:
    - composer validate --strict
    - composer install --no-interaction --optimize-autoloader --prefer-dist
    - composer dump-autoload -o
  artifacts:
    paths:
      - vendor/
    expire_in: 1h

code-quality:
  stage: test
  needs: [validate]
  dependencies:
    - validate
  script:
    - mkdir -p tests/reports
    - ./vendor/bin/phpcs --standard=PSR12 src tests --report=junit --report-file=tests/reports/phpcs.xml || true
  artifacts:
    reports:
      junit: tests/reports/phpcs.xml
  allow_failure: true

static-analysis:
  stage: test
  needs: [validate]
  dependencies:
    - validate
  script:
    - ./vendor/bin/phpstan analyse src --level 5 --no-progress --memory-limit 1G

test-unit:
  stage: test
  needs: [validate]
  script:
    - ./vendor/bin/phpunit --testsuite=Unit

publish-package:
  stage: publish
  needs:
    - validate
    - static-analysis
  rules:
    - if: $CI_COMMIT_TAG
  script: |
    echo "Publishing novadigital/novapost-api-sdk to GitLab Package Registry..."
    curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
         --data tag=$CI_COMMIT_TAG \
         --data sha=$CI_COMMIT_SHA \
         "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"
    echo "Package novadigital/novapost-api-sdk published successfully with version ${CI_COMMIT_TAG}"
